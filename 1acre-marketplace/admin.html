<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Panel | 1Acre</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div style="max-width: 1280px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;">
      <a href="index.html" class="brand-logo">
        1Acre
        <span class="brand-badge" style="background: #ef4444;">ADMIN PANEL</span>
      </a>

      <div style="display: flex; align-items: center; gap: 1.5rem;" class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="properties.html" class="nav-link">Marketplace View</a>
        <a href="admin.html" class="nav-link active">Admin Management</a>
      </div>

      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <select id="global-role-select" style="padding: 0.45rem 0.65rem; border-radius: 0.5rem; border: 1px solid #cbd5e1; font-size: 0.85rem; font-weight: 600; background: #fff;">
          <option value="admin">🛡️ Admin Panel</option>
          <option value="buyer">👤 Buyer View</option>
          <option value="seller">🏡 Seller Portal</option>
        </select>
      </div>
    </div>
  </nav>

  <!-- Admin Main Dashboard -->
  <div style="max-width: 1280px; margin: 2rem auto; padding: 0 1.5rem;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800;">1Acre Platform Administration</h1>
        <p style="color: var(--slate-600); margin-top: 0.25rem;">Review & approve seller listings, grant verification badges, and manage blog posts.</p>
      </div>
    </div>

    <!-- Stats Cards -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem;">
      <div style="background: #fff; padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid #e2e8f0;">
        <span style="font-size: 0.8rem; color: var(--slate-500); font-weight: 700; text-transform: uppercase;">Total Properties</span>
        <h2 style="font-size: 2.2rem; font-weight: 800; color: var(--slate-900);" id="admin-stat-total">0</h2>
      </div>
      <div style="background: #fff; padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid #e2e8f0;">
        <span style="font-size: 0.8rem; color: var(--slate-500); font-weight: 700; text-transform: uppercase;">Pending Approvals</span>
        <h2 style="font-size: 2.2rem; font-weight: 800; color: var(--gold-500);" id="admin-stat-pending">0</h2>
      </div>
      <div style="background: #fff; padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid #e2e8f0;">
        <span style="font-size: 0.8rem; color: var(--slate-500); font-weight: 700; text-transform: uppercase;">1Acre Verified</span>
        <h2 style="font-size: 2.2rem; font-weight: 800; color: var(--primary-800);" id="admin-stat-verified">0</h2>
      </div>
    </div>

    <!-- Approvals & Verification Table -->
    <div style="background: #fff; border-radius: var(--radius-lg); border: 1px solid #e2e8f0; padding: 1.75rem; margin-bottom: 2.5rem;">
      <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 1.25rem;">Property Verification & Approval Queue</h2>
      <div id="admin-approval-table"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadAdminDashboard();
    });

    function loadAdminDashboard() {
      const props = window.db.getProperties();
      
      document.getElementById('admin-stat-total').innerText = props.length;
      document.getElementById('admin-stat-pending').innerText = props.filter(p => p.status === 'pending').length;
      document.getElementById('admin-stat-verified').innerText = props.filter(p => p.verification_status === true).length;

      const table = document.getElementById('admin-approval-table');
      if (props.length === 0) {
        table.innerHTML = `<p style="color: var(--slate-500);">No properties in database.</p>`;
      } else {
        table.innerHTML = props.map(p => `
          <div style="padding: 1.25rem; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
            <div>
              <strong style="font-size: 1.05rem; display: block;">${p.title}</strong>
              <div style="font-size: 0.85rem; color: var(--slate-600); margin-top: 0.25rem;">
                📍 ${p.city}, ${p.district} | Seller: <strong>${p.seller_name} (${p.seller_phone})</strong> | Price: <strong>${p.price_display || '₹ ' + p.price}</strong>
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: 0.75rem;">
              ${p.status === 'pending' ? `
                <button onclick="approveProp('${p.id}', 'active')" class="btn-primary" style="padding: 0.4rem 0.85rem; font-size: 0.8rem;">✓ Approve Listing</button>
                <button onclick="approveProp('${p.id}', 'rejected')" class="btn-outline" style="padding: 0.4rem 0.85rem; font-size: 0.8rem; color: #ef4444; border-color: #ef4444;">✕ Reject</button>
              ` : `
                <span class="brand-badge" style="background: var(--primary-900);">APPROVED</span>
              `}

              <button onclick="toggleVerifyBadge('${p.id}', ${!p.verification_status})" class="btn-gold" style="padding: 0.4rem 0.85rem; font-size: 0.8rem;">
                ${p.verification_status ? '⭐ Verified (Remove)' : '⭐ Grant Verified Badge'}
              </button>
            </div>
          </div>
        `).join('');
      }
    }

    function approveProp(id, status) {
      window.db.updatePropertyStatus(id, status);
      showToast(`Property status updated to: ${status.toUpperCase()}`);
      loadAdminDashboard();
    }

    function toggleVerifyBadge(id, newStatus) {
      window.db.updatePropertyStatus(id, undefined, newStatus);
      showToast(newStatus ? 'Granted 1Acre Verified Badge!' : 'Removed verification badge');
      loadAdminDashboard();
    }
  </script>
</body>
</html>
